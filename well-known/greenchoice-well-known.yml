method: probed
source: >-
  Live unauthenticated GET probes of the RFC 8615 well-known path list against every host
  this record knows: the registrable domain and www, the customer portal (mijn.greenchoice.nl),
  the identity provider that portal redirects to (sso.greenchoice.nl), and the mobile-app
  host (app.greenchoice.nl).
note: >-
  One real document was found. https://sso.greenchoice.nl/.well-known/openid-configuration
  returns an OpenID Connect 1.0 discovery document (application/json) whose issuer is
  https://sso.greenchoice.nl — Greenchoice's own Duende/IdentityServer deployment, reached by
  following the 302 from https://mijn.greenchoice.nl/ to
  /connect/authorize?client_id=app-mijngreenchoice. Everything else missed. Two hosts answer
  HTTP 200 with an HTML single-page-app shell for EVERY /.well-known/* path
  (mijn.greenchoice.nl and sso.greenchoice.nl) — those are catch-all routes, not documents,
  and are recorded as misses. app.greenchoice.nl (the host the mobile app calls) resets the
  TLS handshake for a desktop browser user-agent and could not be probed at all.
subdomain_enumeration:
  source: 'https://crt.sh/?q=%25.greenchoice.nl&output=json'
  status: 200
  note: >-
    Certificate Transparency was used to enumerate Greenchoice hosts rather than guessing path
    patterns. It surfaced 79 names. Those worth probing were probed: sso (the hit),
    techradar.greenchoice.nl (a real public tech radar, see techradar/), lumi, b2b,
    serviceportaal, compliance and mijnlaadpas. Notably there is NO api.* or developer.* host —
    api.greenchoice.nl, developer.greenchoice.nl, status.greenchoice.nl and tools.greenchoice.nl
    all fail to resolve. Several tennet-*.greenchoice.nl and tennetb2b-*.greenchoice.nl names
    exist, which is Greenchoice's B2B message exchange with TenneT, the Dutch transmission system
    operator; that surface is private market infrastructure, refuses public TLS connections, and
    is recorded here only as an observation, never as a published contract.
