aid: greenchoice
name: Greenchoice
description: >-
  Greenchoice is a Dutch energy supplier focused on green electricity and gas, offering renewable
  energy contracts, solar panels, home batteries, heat pumps and EV charging to consumers and
  businesses in the Netherlands. It runs no developer programme and publishes no API: the only
  machine-readable contract on any Greenchoice host is the OpenID Connect discovery document
  behind its own customer single sign-on at sso.greenchoice.nl.
